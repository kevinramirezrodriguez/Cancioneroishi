    // ---------- Modo administrador: acceso con contraseña y publicación en GitHub ----------
    const CLAVE_ADMIN = 'cancionero_admin_v1';
    const API_GITHUB = 'https://api.github.com';
    let adminActivo = false, tokenGH = '', passAdmin = '', modoCfg = 'nuevo', publicando = false, reintentarPublicar = false;
    let tapsMarca = 0, tapsT = 0;
    const enc = new TextEncoder(), dec = new TextDecoder();

    function cfgAdmin() { try { return JSON.parse(localStorage.getItem(CLAVE_ADMIN)); } catch (e) { return null; } }
    function b64(buf) {
        const u = new Uint8Array(buf); let t = '';
        for (let i = 0; i < u.length; i += 0x8000) t += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
        return btoa(t);
    }
    const deb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
    async function claveDe(pass, salt) {
        const km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    async function cifrarToken(pass, token) {
        const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await claveDe(pass, salt), enc.encode(token));
        return { salt: b64(salt), iv: b64(iv), ct: b64(ct) };
    }
    async function descifrarToken(pass, cfg) {
        try {
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deb64(cfg.iv) }, await claveDe(pass, deb64(cfg.salt)), deb64(cfg.ct));
            return dec.decode(pt);
        } catch (e) { return null; }
    }
    function repoPorDefecto() {
        let owner = '', repo = '';
        if (/\.github\.io$/i.test(location.hostname)) {
            owner = location.hostname.split('.')[0];
            repo = location.pathname.split('/').filter(Boolean)[0] || (owner + '.github.io');
            if (/\.html?$/i.test(repo)) repo = owner + '.github.io';
        }
        return { owner, repo, path: NOMBRE_ARCHIVO, branch: 'main' };
    }
    function diasPara(f) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f || '');
        if (!m) return null;
        return Math.ceil((new Date(+m[1], +m[2] - 1, +m[3], 23, 59).getTime() - Date.now()) / 86400000);
    }

    // Gesto escondido: 7 toques seguidos en el título
    function tocarMarca() {
        clearTimeout(tapsT); tapsMarca++;
        tapsT = setTimeout(() => { tapsMarca = 0; }, 2500);
        if (tapsMarca >= 7) {
            tapsMarca = 0;
            if (cfgAdmin()) mostrarEntrada(); else abrirCfgAdmin('nuevo');
        }
    }

    function mostrarEntrada() {
        el('entradaElegir').style.display = 'flex';
        el('entradaClave').style.display = 'none';
        el('entClave').value = ''; el('entErr').textContent = '';
        el('entrada').classList.add('open');
    }
    function entrarUsuario() { salirAdmin(); el('entrada').classList.remove('open'); }
    function entrarAdmin() {
        el('entradaElegir').style.display = 'none';
        el('entradaClave').style.display = 'flex';
        setTimeout(() => el('entClave').focus(), 100);
    }
    async function confirmarClave() {
        const cfg = cfgAdmin();
        if (!cfg) { mostrarEntrada(); return; }
        const pass = el('entClave').value;
        if (!pass) return;
        el('entErr').textContent = 'Comprobando…';
        const t = await descifrarToken(pass, cfg);
        if (t === null) {
            el('entErr').textContent = (window.crypto && crypto.subtle) ? 'Contraseña incorrecta' : 'Este navegador no permite cifrar aquí. Abre la app desde su dirección https.';
            return;
        }
        tokenGH = t; passAdmin = pass;
        entrarComoAdmin();
    }
    function entrarComoAdmin() {
        adminActivo = true;
        document.body.classList.add('admin');
        el('entrada').classList.remove('open');
        const cfg = cfgAdmin(), d = cfg && diasPara(cfg.venc);
        if (d !== null && d !== undefined) {
            if (d < 0) aviso('Tu token de GitHub ya venció. Genera uno nuevo en ⚙ → Cambiar el token.', 7000);
            else if (d <= 14) aviso('Tu token de GitHub vence en ' + d + (d === 1 ? ' día' : ' días') + '. Conviene generar uno nuevo.', 7000);
        }
    }
    function salirAdmin() {
        adminActivo = false; tokenGH = ''; passAdmin = '';
        document.body.classList.remove('admin');
        ['panelAdmin', 'setEd', 'cfgAdmin', 'picker'].forEach(id => ov(id, false));
        if (esVistaSet() || vista === 'lib') irA(vista);
    }
    function quitarAdmin() {
        if (!confirm('Se quita el modo administrador y el token guardado en ESTE teléfono. Podrás volver a configurarlo con el gesto de 7 toques. ¿Continuar?')) return;
        try { localStorage.removeItem(CLAVE_ADMIN); } catch (e) {}
        el('entrada').classList.remove('open');
        salirAdmin();
        aviso('Modo administrador quitado de este teléfono');
    }

    function abrirPanelAdmin() { if (!adminActivo) return; renderPanelAdmin(); ov('panelAdmin', true); }
    function cerrarPanelAdmin() { ov('panelAdmin', false); irA(vista); }
    function renderPanelAdmin() {
        const cfg = cfgAdmin() || {};
        const e = el('admEstado');
        e.className = 'hint estado ' + (dirty ? 'pend' : 'ok');
        e.textContent = dirty ? 'Hay cambios sin publicar (canciones o sets).' : '✔ Todo lo que ves ya está publicado.';
        const l = setsOrdenados().reverse();
        el('admSets').innerHTML = l.length ? l.map(o => `<div class="set-row"><span class="nm">${escapeHtml(o.nombre || 'Set')}<small>${escapeHtml(fmtFecha(o.fecha))} · ${idsVigentes(o.canciones).length} canciones</small></span><button onclick="abrirSetEd('${escapeHtml(o.id)}')" aria-label="Editar">✎</button></div>`).join('')
            : '<div class="hint" style="margin:0 0 8px">Todavía no hay sets oficiales.</div>';
        const d = diasPara(cfg.venc);
        el('admRepo').textContent = (cfg.owner || '?') + '/' + (cfg.repo || '?') + ' · rama ' + (cfg.branch || '?') + ' · ' + (cfg.path || '?') + (cfg.venc ? ' · token vence el ' + cfg.venc + (d !== null && d < 0 ? ' (VENCIDO)' : '') : '');
    }

    // Pantalla para configurar al administrador o cambiar el token
    function abrirCfgAdmin(modo) {
        modoCfg = modo;
        const cfg = cfgAdmin() || {}, def = repoPorDefecto();
        const nuevo = modo === 'nuevo';
        el('cfgHead').textContent = nuevo ? 'Configurar administrador' : 'Cambiar el token';
        el('cfgAyuda').textContent = nuevo
            ? 'Elige una contraseña y pega tu token de GitHub (con permiso Contents: Read and write solo para este repositorio). El token se guarda cifrado con tu contraseña, solo en este teléfono.'
            : 'Pega el token nuevo. Se guarda cifrado con tu misma contraseña.';
        el('cfgClaveBox').style.display = nuevo ? '' : 'none';
        el('cfgRepoBox').style.display = nuevo ? '' : 'none';
        el('cfgClave').value = ''; el('cfgClave2').value = ''; el('cfgToken').value = '';
        el('cfgVenc').value = '';
        el('cfgOwner').value = cfg.owner || def.owner; el('cfgRepo').value = cfg.repo || def.repo;
        el('cfgPath').value = cfg.path || def.path; el('cfgBranch').value = cfg.branch || def.branch;
        ov('cfgAdmin', true);
    }
    function cerrarCfgAdmin() { ov('cfgAdmin', false); reintentarPublicar = false; }
    async function probarToken(token, c) {
        try {
            const r = await fetch(`${API_GITHUB}/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(c.branch)}`,
                { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
            if (r.ok) return 'ok';
            if (r.status === 401) return 'invalido';
            if (r.status === 404) return 'norepo';
            return 'otro';
        } catch (e) { return 'red'; }
    }
    async function guardarCfgAdmin() {
        const nuevo = modoCfg === 'nuevo';
        const token = el('cfgToken').value.trim();
        if (!(window.crypto && crypto.subtle)) { aviso('Este navegador no permite cifrar aquí. Abre la app desde su dirección https.', 6000); return; }
        let pass = passAdmin;
        if (nuevo) {
            pass = el('cfgClave').value;
            if (pass.length < 6) { aviso('La contraseña debe tener al menos 6 caracteres', 4000); return; }
            if (pass !== el('cfgClave2').value) { aviso('Las contraseñas no coinciden', 4000); return; }
        }
        if (!token) { aviso('Pega el token de GitHub', 4000); return; }
        const previo = cfgAdmin() || {};
        const c = nuevo
            ? { owner: el('cfgOwner').value.trim(), repo: el('cfgRepo').value.trim(), path: el('cfgPath').value.trim() || 'index.html', branch: el('cfgBranch').value.trim() || 'main' }
            : { owner: previo.owner, repo: previo.repo, path: previo.path, branch: previo.branch };
        if (!c.owner || !c.repo) { aviso('Escribe el usuario y el repositorio de GitHub', 4000); return; }
        el('btnCfgGuardar').disabled = true;
        try {
            const est = await probarToken(token, c);
            if (est === 'invalido') { aviso('GitHub no aceptó ese token. Revisa que lo copiaste completo y que no esté vencido.', 6000); return; }
            if (est === 'norepo') { aviso('No encuentro ese repositorio, rama o archivo, o el token no tiene acceso a él.', 6000); return; }
            if (est === 'red' && !confirm('No pude comprobar el token (sin internet). ¿Guardarlo de todos modos?')) return;
            const cif = await cifrarToken(pass, token);
            try { localStorage.setItem(CLAVE_ADMIN, JSON.stringify(Object.assign({}, c, cif, { v: 1, venc: el('cfgVenc').value || '' }))); }
            catch (e) { aviso('No se pudo guardar en este teléfono', 4000); return; }
            tokenGH = token; passAdmin = pass;
            const volver = reintentarPublicar; reintentarPublicar = false;
            ov('cfgAdmin', false);
            if (!adminActivo) entrarComoAdmin();
            if (el('panelAdmin').classList.contains('open')) renderPanelAdmin();
            aviso('✔ Listo', 2500);
            if (volver) publicarEnGitHub(true);
        } finally { el('btnCfgGuardar').disabled = false; }
    }
    function tokenInvalido() {
        aviso('Tu token de GitHub venció o ya no es válido. Pega uno nuevo.', 6000);
        reintentarPublicar = true;
        abrirCfgAdmin('token');
    }

    // Publica este index.html en el repositorio: es lo que descargan los usuarios
    async function publicarEnGitHub(sinPreguntar) {
        if (!adminActivo || !tokenGH) { aviso('Entra como administrador para publicar'); return; }
        if (publicando) return;
        const cfg = cfgAdmin(); if (!cfg) return;
        const r = construirHtml();
        if (!r) { aviso('No se pudo preparar el archivo', 4000); return; }
        if (!sinPreguntar && !confirm('Se publicará para TODOS los usuarios lo que ves en este teléfono: canciones, notas y sets oficiales.\n\n¿Publicar ahora?')) return;
        publicando = true;
        const btn = el('btnPublicar'); btn.disabled = true; btn.textContent = 'Publicando…';
        try {
            const url = `${API_GITHUB}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;
            const cab = { 'Authorization': 'Bearer ' + tokenGH, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
            const contenido = b64(enc.encode(r.html));
            let res = null;
            for (let intento = 0; intento < 2; intento++) {
                const g = await fetch(url + '?ref=' + encodeURIComponent(cfg.branch), { headers: cab, cache: 'no-store' });
                if (g.status === 401) { tokenInvalido(); return; }
                const sha = g.ok ? (await g.json()).sha : undefined;
                res = await fetch(url, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, cab),
                    body: JSON.stringify({ message: 'Actualización del cancionero desde la app', content: contenido, sha: sha, branch: cfg.branch }) });
                if ((res.status === 409 || res.status === 422) && intento === 0) continue;   // el archivo cambió mientras tanto: se pide de nuevo
                break;
            }
            if (res.status === 401) { tokenInvalido(); return; }
            if (res.status === 403) { aviso('GitHub no dejó escribir. Revisa que el token tenga el permiso Contents: Read and write para este repositorio.', 8000); return; }
            if (res.status === 404) { aviso('No encuentro el repositorio, la rama o el archivo, o el token no tiene acceso. Revisa la conexión en ⚙.', 8000); return; }
            if (!res.ok) { aviso('GitHub respondió con un error (' + res.status + '). Intenta de nuevo.', 6000); return; }
            try { localStorage.removeItem(CLAVE_ADMIN_SETS); } catch (e) {}
            marcarGuardado(r.version);
            renderPanelAdmin();
            aviso('✔ Publicado. Los usuarios lo verán en 1 o 2 minutos.', 8000);
        } catch (e) {
            aviso('No pude conectar con GitHub. Revisa tu internet e intenta de nuevo.', 6000);
        } finally {
            publicando = false; btn.disabled = false; btn.textContent = '⬆ Publicar';
        }
    }

    // Resumen de la última fusión con el archivo oficial
    if (resumenFusion && (resumenFusion.nuevas || resumenFusion.actualizadas || resumenFusion.conflictos)) {
        const partes = [];
        if (resumenFusion.nuevas) partes.push(resumenFusion.nuevas + (resumenFusion.nuevas === 1 ? ' canción nueva' : ' canciones nuevas'));
        if (resumenFusion.actualizadas) partes.push(resumenFusion.actualizadas + (resumenFusion.actualizadas === 1 ? ' actualizada' : ' actualizadas'));
        if (resumenFusion.conflictos) partes.push(resumenFusion.conflictos + (resumenFusion.conflictos === 1 ? ' con cambios distintos (se conservó la tuya; abre ✎ para usar la oficial)' : ' con cambios distintos (se conservaron las tuyas; abre ✎ para usar la oficial)'));
        setTimeout(() => aviso('Actualización: ' + partes.join(' · '), 7000), 700);
    }

    // Actualización automática: al abrir la app o volver a ella, revisa si hay un index.html nuevo y, si lo hay, se recarga sola.
    // Tus cambios locales se guardan antes de recargar; las canciones nuevas se fusionan sin pisar lo que personalizaste.
    // En modo administrador no se recarga sola (para no perder la sesión mientras trabajas).
    if (EN_LINEA) {
        const CLAVE_ETAG = 'cancionero_firma_v1';
        let revisando = false, ultima = 0;
        async function buscarActualizacion() {
            if (revisando || Date.now() - ultima < 15000) return;      // como máximo una revisión cada 15 s
            if (!navigator.onLine) return;
            revisando = true; ultima = Date.now();
            try {
                const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
                const firma = r.ok ? (r.headers.get('etag') || r.headers.get('last-modified') || '') : '';
                if (!firma) return;
                let guardada = null;
                try { guardada = localStorage.getItem(CLAVE_ETAG); } catch (e) {}
                try { localStorage.setItem(CLAVE_ETAG, firma); } catch (e) { return; }
                if (guardada && guardada !== firma) {
                    const ocupado = adminActivo || el('entrada').classList.contains('open') || document.querySelector('.editor.open, .escena.open');
                    if (ocupado) { try { localStorage.setItem(CLAVE_ETAG, guardada); } catch (e) {} return; }   // se aplicará en la próxima revisión
                    aviso('Actualizando a la versión nueva…', 1500);
                    setTimeout(() => location.reload(), 600);
                }
            } catch (e) {} finally { revisando = false; }
        }
        window.addEventListener('load', buscarActualizacion);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') buscarActualizacion(); });
        window.addEventListener('online', buscarActualizacion);
    }

    // Si este teléfono es de administrador, al abrir la app se elige cómo entrar
    if (cfgAdmin()) mostrarEntrada();

    // Funciona sin internet cuando está publicado: el service worker guarda una copia de la app
    if ('serviceWorker' in navigator && EN_LINEA) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
</script></body></html>

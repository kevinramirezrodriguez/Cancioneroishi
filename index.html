<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#15130f">
    <title>Cancionero Ishi</title>

    <!-- App instalable: al publicarlo en internet se puede agregar a la pantalla de inicio del teléfono -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cancionero Ishi">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script>
        /* Aplica el tema guardado antes de pintar la página (evita el parpadeo) */
        (function () {
            try {
                var p = JSON.parse(localStorage.getItem('cancionero_prefs_v2')) || {};
                if (p.tema === 'claro') {
                    document.documentElement.setAttribute('data-tema', 'claro');
                    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', '#faf6ec');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --bg: #15130f;
            --panel: #201d17;
            --panel2: #2a261e;
            --line: #3a3428;
            --tx: #f4ecdc;
            --mut: #a89f8c;
            --acc: #8fd0f2;
            --acc-tx: #0b2230;
            --coral: #ff6b4a;
            --chord: #b6e2f8;
            --lyrics-size: 17px;
            --acc-ink: #8fd0f2;      /* azul usado como color de TEXTO */
            --strong: #ffffff;       /* negritas */
            --ok: #7ee787;
            --tile-on: #1b3646;
            --overlay: rgba(32,29,23,0.92);
            --overlay2: rgba(21,19,15,0.97);
            --toast-bg: #ffffff; --toast-tx: #111111;
        }
        /* ---------- Tema claro ---------- */
        :root[data-tema="claro"] {
            --bg: #faf6ec;
            --panel: #ffffff;
            --panel2: #efe8d8;
            --line: #d8cfba;
            --tx: #1c1912;
            --mut: #6d6551;
            --coral: #d4441f;
            --chord: #0b6a98;
            --acc-ink: #0b6a98;
            --strong: #000000;
            --ok: #1a7f37;
            --tile-on: #dcf0fb;
            --overlay: rgba(255,255,255,0.94);
            --overlay2: rgba(250,246,236,0.97);
            --toast-bg: #1c1912; --toast-tx: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--tx);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }
        body.noscroll { overflow: hidden; }
        button { font-family: inherit; cursor: pointer; }

        /* ---------- Encabezado con pestañas ---------- */
        .head { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: calc(12px + env(safe-area-inset-top)) 14px 10px; border-bottom: 1px solid var(--line); }
        .brand { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--acc-ink); font-weight: 800; margin-bottom: 8px; }
        .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border-radius: 14px; padding: 4px; gap: 4px; }
        .seg button { border: none; background: transparent; color: var(--mut); font-size: 15px; font-weight: 700; min-height: 44px; border-radius: 11px; }
        .seg button.on { background: var(--acc); color: var(--acc-tx); }
        .seg b { background: rgba(0,0,0,0.18); border-radius: 10px; padding: 1px 8px; margin-left: 6px; font-size: 13px; }
        .seg button:not(.on) b { background: var(--panel2); color: var(--tx); }

        .view { display: none; padding: 14px; max-width: 820px; margin: 0 auto; }
        .view.on { display: block; }

        /* ---------- Biblioteca (mosaicos) ---------- */
        .search { width: 100%; min-height: 50px; padding: 0 18px; font-size: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--tx); outline: none; }
        .search:focus { border-color: var(--acc); }
        .hint { font-size: 13px; color: var(--mut); margin: 10px 4px 12px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 110px; }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        .tile {
            position: relative; min-height: 138px; background: var(--panel); border: 2px solid var(--line);
            border-radius: 18px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; overflow: hidden;
        }
        .tile.on { border-color: var(--acc); background: linear-gradient(160deg, var(--tile-on), var(--panel)); }
        .tile .key { font-size: 15px; font-weight: 800; color: var(--tx); letter-spacing: 1px; line-height: 1; padding-right: 40px; }
        .tile .tt { margin-top: 2px; font-size: 17px; font-weight: 800; color: var(--acc-ink); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .tile .sub { font-size: 12px; color: var(--mut); margin-top: 3px; display: block; font-weight: 400; }
        .tile .tick {
            position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%;
            border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
        }
        .tile.on .tick { background: var(--acc); border-color: var(--acc); color: var(--acc-tx); }
        .tile .mini {
            position: absolute; bottom: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%;
            border: none; background: var(--panel2); color: var(--mut); font-size: 16px;
        }
        .tile .txt { padding-right: 36px; }
        .empty { text-align: center; color: var(--mut); padding: 40px 10px; line-height: 1.6; }
        .empty .btn-acc { margin-top: 14px; }

        .fab {
            position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 30;
            width: 64px; height: 64px; border-radius: 22px; border: none; background: var(--acc); color: var(--acc-tx);
            font-size: 34px; font-weight: 300; box-shadow: 0 8px 22px rgba(143,208,242,0.32); display: none;
        }
        body.lib .fab { display: block; }

        /* ---------- Mi set (modo escenario) ---------- */
        .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--mut); border-radius: 16px; padding: 0 11px; min-height: 31px; font-size: 12px; font-weight: 700; max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chip.on { background: var(--acc); border-color: var(--acc); color: var(--acc-tx); }

        .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px 14px 14px; margin-bottom: 150px; position: relative; }
        .s-top { display: flex; align-items: flex-start; gap: 8px; }
        .s-num { font-size: 26px; font-weight: 900; color: var(--line); line-height: 1; }
        .s-title { flex: 1; min-width: 0; }
        .s-title h2 { margin: 0; font-size: 17px; line-height: 1.2; }
        .s-title small { color: var(--mut); font-size: 12px; display: block; margin-top: 2px; }
        .badge { display: inline-block; margin-top: 5px; background: var(--acc); color: var(--acc-tx); font-weight: 900; border-radius: 6px; padding: 2px 8px; font-size: 12px; letter-spacing: 1px; }
        .s-order { display: flex; gap: 6px; margin: 10px 0; }
        .s-order button { flex: 1; min-height: 32px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); border-radius: 10px; font-size: 12px; font-weight: 700; }
        .s-order button.rm { color: var(--coral); }
        .s-order button:disabled { opacity: 0.35; }

        pre.lyrics {
            margin: 0; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: var(--lyrics-size); line-height: 1.65;
            overflow-x: auto; white-space: pre; padding: 4px 0 8px; -webkit-overflow-scrolling: touch;
        }
        .stage.wrap pre.lyrics { white-space: pre-wrap; word-break: break-word; }
        pre.lyrics .ch { color: var(--chord); font-weight: 800; }
        pre.lyrics .sec { background: rgba(255,107,74,0.16); color: var(--coral); border-radius: 6px; padding: 1px 8px; font-weight: 700; font-size: 0.82em; text-transform: uppercase; letter-spacing: 1px; }
        pre.lyrics strong { color: var(--strong); }
        pre.lyrics:empty::before { content: "Sin letra todavía. Toca ✎ para pegar la letra con acordes."; color: var(--mut); font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; font-style: italic; white-space: normal; }

        details.notes { margin: 4px 0 10px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
        details.notes summary { font-weight: 700; color: var(--mut); min-height: 36px; display: flex; align-items: center; cursor: pointer; list-style: none; }
        details.notes summary::-webkit-details-marker { display: none; }
        .note-tools { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
        .note-tools small { color: var(--mut); font-size: 12px; }
        .note-ed { min-height: 60px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-size: 16px; outline: none; white-space: pre-wrap; }
        .note-ed:focus { border-color: var(--acc); }
        .note-ed:empty::before { content: attr(data-ph); color: var(--mut); }

        /* Riel flotante lateral */
        /* Herramientas emergentes: cerradas solo se ve un botón pequeño; al tocarlo se despliegan */
        .rail { position: fixed; right: 10px; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 25; display: none; flex-direction: column; align-items: center; gap: 8px; }
        body.set.hasset .rail { display: flex; }
        .rail-tools { display: none; flex-direction: column; gap: 10px; background: var(--overlay); border: 1px solid var(--line); border-radius: 26px; padding: 8px; backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
        .rail.open .rail-tools { display: flex; }
        .rail button { width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--panel2); color: var(--tx); font-size: 17px; font-weight: 800; }
        .rail button.main { background: var(--acc); color: var(--acc-tx); }
        .rail .rail-toggle { width: 44px; height: 44px; font-size: 15px; border: 1px solid var(--line); background: var(--overlay); color: #f5a524; font-weight: 900; backdrop-filter: blur(6px); opacity: 0.85; box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
        .rail.open .rail-toggle { opacity: 1; }
        :root[data-tema="claro"] .rail .rail-toggle { color: #b86e00; }   /* amarillo más oscuro para que se lea sobre fondo claro */

        /* Barra de paginación */
        .pager { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: none; align-items: center; gap: 10px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
        body.set.hasset .pager { display: flex; }
        .pager button { flex: 1; min-height: 56px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); font-size: 17px; font-weight: 800; }
        .pager button.next { background: var(--acc); border-color: var(--acc); color: var(--acc-tx); }
        .pager button:disabled { opacity: 0.35; }
        .pager .pos { flex: 0 0 auto; font-weight: 800; color: var(--mut); min-width: 58px; text-align: center; }

        .btn-acc { background: var(--acc); color: var(--acc-tx); border: none; border-radius: 14px; min-height: 48px; padding: 0 20px; font-weight: 800; font-size: 15px; }
        .btn-b { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); font-weight: 900; font-size: 17px; }

        /* ---------- Guardado en el archivo HTML ---------- */
        .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .brand-row .brand { margin: 0; }
        .btn-html { position: relative; border: 1px solid var(--line); background: var(--panel); color: var(--acc-ink); font-weight: 800; font-size: 13px; border-radius: 12px; min-height: 36px; padding: 0 12px; }
        .head-btns { display: flex; gap: 8px; align-items: center; }
        .btn-tema { width: 40px; padding: 0; font-size: 17px; }
        html { color-scheme: dark; }
        :root[data-tema="claro"] { color-scheme: light; }
        .btn-adm { display: none; }
        body.admin .btn-adm { display: inline-block; }
        .tag-admin { display: none; margin-left: 8px; background: var(--coral); color: #fff; font-size: 9px; font-weight: 900; letter-spacing: 1px; padding: 2px 6px; border-radius: 6px; vertical-align: middle; }
        body.admin .tag-admin { display: block; width: fit-content; margin: 4px 0 0; }
        .brand { white-space: nowrap; }
        body.admin #btnHtml { width: 40px; padding: 0; font-size: 0; }
        body.admin #btnHtml::before { content: '💾'; font-size: 17px; }
        .seg.tres { grid-template-columns: 1fr 1fr 1fr; }
        .seg.tres button { font-size: 14px; padding: 0 4px; }
        .seg.tres b { margin-left: 4px; padding: 1px 6px; }
        .sem-head { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; }
        .sem-head select { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); font-size: 15px; font-weight: 700; padding: 0 10px; }
        .sem-head .fila { display: flex; gap: 8px; margin-top: 8px; }
        .sem-head .fila button { flex: 1; min-height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); font-weight: 700; font-size: 13px; }
        .sem-head .aviso-sem { margin-top: 8px; font-size: 13px; color: var(--coral); font-weight: 700; line-height: 1.35; }
        .set-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; margin-bottom: 6px; }
        .set-row .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; line-height: 1.25; }
        .set-row .nm small { display: block; color: var(--mut); font-weight: 400; font-size: 12px; }
        .set-row button { width: 38px; height: 38px; flex: 0 0 auto; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); font-weight: 800; }
        .set-row button.rojo { color: var(--coral); }
        .set-row.pick { cursor: pointer; }
        .set-row.pick.on { border-color: var(--acc); background: linear-gradient(160deg, var(--tile-on), var(--panel)); }
        .set-row .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex: 0 0 auto; }
        .set-row.pick.on .ck { background: var(--acc); border-color: var(--acc); color: var(--acc-tx); }
        .ed-body input[type="date"], .ed-body input[type="password"], .ed-body input[type="search"] { width: 100%; min-height: 48px; padding: 0 14px; font-size: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--tx); outline: none; }
        .entrada { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; }
        .entrada.open { display: flex; }
        .entrada h1 { margin: 0 0 8px; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--acc-ink); }
        .entrada .grande { width: 100%; max-width: 340px; min-height: 62px; border-radius: 18px; border: 2px solid var(--line); background: var(--panel); color: var(--tx); font-size: 18px; font-weight: 800; }
        .entrada .grande.p { background: var(--acc); border-color: var(--acc); color: var(--acc-tx); }
        .entrada input { width: 100%; max-width: 340px; min-height: 54px; padding: 0 16px; font-size: 17px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--tx); outline: none; }
        .entrada .err { color: var(--coral); font-weight: 700; min-height: 20px; text-align: center; }
        .entrada .chico { background: none; border: none; color: var(--mut); text-decoration: underline; font-size: 13px; padding: 8px; }
        .btn-html .dot { display: none; position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--coral); border: 2px solid var(--bg); }
        .estado { margin: -4px 4px 12px; font-weight: 700; }
        .estado.ok { color: var(--ok); }
        .estado.pend { color: var(--acc-ink); }

        .link-btn { display: inline-block; margin: 0 4px 12px; background: none; border: 1px dashed var(--line); color: var(--acc-ink); border-radius: 10px; min-height: 36px; padding: 0 12px; font-weight: 700; font-size: 13px; }

        /* ---------- Play: pantalla limpia ---------- */
        .play-row { display: none; width: 100%; min-height: 42px; margin-bottom: 8px; border: none; border-radius: 14px; background: var(--acc); color: var(--acc-tx); font-size: 15px; font-weight: 800; }
        body.hasset .play-row { display: block; }
        .play-fab { position: fixed; right: 94px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 30; height: 64px; padding: 0 20px; border-radius: 22px; border: 2px solid var(--acc); background: var(--panel2); color: var(--acc-ink); font-size: 17px; font-weight: 800; display: none; }
        body.lib.hasset .play-fab { display: block; }
        .escena { position: fixed; inset: 0; z-index: 150; background: var(--bg); display: none; flex-direction: column; }
        .escena.open { display: flex; }
        .esc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px 16px; border-bottom: 1px solid var(--line); }
        .esc-info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .esc-pos { color: var(--mut); font-weight: 800; font-size: 13px; flex: 0 0 auto; }
        .esc-titulo { font-size: 18px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .esc-tono { background: var(--acc); color: var(--acc-tx); font-weight: 900; font-size: 12px; border-radius: 6px; padding: 2px 8px; letter-spacing: 1px; white-space: nowrap; flex: 0 0 auto; }
        .esc-x { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--panel2); color: var(--mut); font-size: 18px; flex: 0 0 auto; }
        .esc-body { flex: 1; overflow-y: auto; padding: 12px 16px 110px; -webkit-overflow-scrolling: touch; }
        .escena.wrap pre.lyrics { white-space: pre-wrap; word-break: break-word; }
        .esc-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: var(--overlay2); border-top: 1px solid var(--line); transform: translateY(100%); transition: transform .2s; }
        .esc-bar.show { transform: none; }
        .esc-bar button { flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); font-size: 16px; font-weight: 800; }
        .esc-bar button:disabled { opacity: 0.35; }

        /* ---------- Resaltado de texto (6 colores) ---------- */
        .hl1 { background: #ffe066; }
        .hl2 { background: #7ee787; }
        .hl3 { background: #79c0ff; }
        .hl4 { background: #ff8fb1; }
        .hl5 { background: #ffa657; }
        .hl6 { background: #d2a8ff; }
        /* Sin padding horizontal para no mover los acordes que están sobre la letra */
        pre.lyrics mark.hl, pre.lyrics mark.hl strong { color: #1d1400; border-radius: 3px; }
        .hl-pal { display: none; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
        .hl-pal.open { display: flex; }
        .hl-pal .sw { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
        .hl-pal .sp2 { flex: 1; min-width: 4px; }
        .hl-pal .t { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); padding: 0 12px; font-weight: 700; font-size: 13px; }

        /* ---------- Editor a pantalla completa ---------- */
        .editor { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none; flex-direction: column; }
        .editor.open { display: flex; }
        .ed-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; border-bottom: 1px solid var(--line); }
        .ed-bar h3 { margin: 0; font-size: 16px; }
        .ed-bar button { min-height: 44px; border-radius: 12px; border: none; padding: 0 16px; font-weight: 800; font-size: 15px; }
        .ed-bar .cancel { background: var(--panel2); color: var(--tx); }
        .ed-bar .ok { background: var(--acc); color: var(--acc-tx); }
        .ed-body { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow-y: auto; }
        .ed-row { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
        .ed-body label { font-size: 12px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }
        .ed-body input[type="text"] { width: 100%; min-height: 48px; padding: 0 14px; font-size: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--tx); outline: none; }
        .ed-body input[type="text"]:focus, .ed-body textarea:focus { border-color: var(--acc); }
        .ed-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .ed-tools .sp { flex: 1; }
        .ed-tools .t { min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--tx); padding: 0 12px; font-weight: 700; font-size: 14px; }
        .ed-tools .t:disabled { opacity: 0.35; }
        #edTexto {

        const corte = f.indexOf('<title>');
        return f.slice(0, corte)
            .replace(/ data-tema="[^"]*"/, '')
            .replace(/(name="theme-color" content=")[^"]*(")/, '$1#15130f$2') + f.slice(corte);
    })();

    // El archivo HTML es la fuente principal de las canciones. El navegador solo guarda una copia de trabajo
    // para no perder lo que agregues o cambies mientras no descargues el HTML actualizado.
    const CLAVE_LOCAL = 'cancionero_local_v5';
    const CLAVE_ANTERIOR = 'mis_canciones_cancionero_v4';   // versión anterior, donde todo vivía solo en el navegador
    const CLAVE_SET = 'cancionero_set_v4';
    const CLAVE_PREFS = 'cancionero_prefs_v2';

    const el = id => document.getElementById(id);

    const DATOS = (function () {
        try { return JSON.parse(el('datos-canciones').textContent); } catch (e) { return { version: 0, canciones: [] }; }
    })();
    const sinVista = lista => lista.map(s => { const c = Object.assign({}, s); delete c.trans; return c; });
    const copia = x => JSON.parse(JSON.stringify(x));

    let canciones = copia(DATOS.canciones);
    let baseActual = DATOS.version;   // versión del archivo sobre la que se está trabajando
    let dirty = false;                // true = hay cambios que todavía no están en el archivo HTML
    let snap = null;                  // copia de las canciones OFICIALES tal como llegaron la última vez (sirve para saber qué cambió cada quien)
    let conflictos = {};              // canciones donde el archivo y este teléfono cambiaron lo mismo: { id: { campos, oficial } }
    let resumenFusion = null;
    let setsOficiales = [];           // sets oficiales (los arma el administrador): [{ id, nombre, fecha, canciones: [ids] }]

    // ---------- Fusión: una versión nueva del archivo no pisa lo que cada persona personalizó ----------
    const CAMPOS = ['titulo', 'tono', 'comentario', 'notas'];
    const valorCampo = (c, k) => (c && typeof c[k] === 'string') ? c[k] : '';
    function snapDe(lista) { const m = {}; sinVista(lista).forEach(c => { m[c.id] = c; }); return m; }

    // Diferencias por líneas entre dos textos: lista de tramos { bs, be, lines } = "las líneas base[bs..be) pasan a ser lines"
    function tramos(B, X) {
        const n = B.length, m = X.length, w = m + 1;
        const t = new Uint16Array((n + 1) * w);
        for (let i = n - 1; i >= 0; i--) {
            for (let j = m - 1; j >= 0; j--) {
                t[i * w + j] = B[i] === X[j] ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
            }
        }
        const out = [];
        let i = 0, j = 0, bs = 0, xs = 0;
        const cerrar = () => { if (i > bs || j > xs) out.push({ bs, be: i, lines: X.slice(xs, j) }); };
        while (i < n && j < m) {
            if (B[i] === X[j]) { cerrar(); i++; j++; bs = i; xs = j; }
            else if (t[(i + 1) * w + j] >= t[i * w + j + 1]) i++;
            else j++;
        }
        i = n; j = m; cerrar();
        return out;
    }

    // Mezcla tres versiones de una letra: la oficial anterior (base), la de la persona (mia) y la oficial nueva (nueva).
    // Los cambios en líneas distintas se juntan; si los dos cambiaron las mismas líneas, se queda lo de la persona.
    function fusionarTexto(base, mia, nueva) {
        if (mia === base) return { texto: nueva, choques: 0 };
        if (nueva === base || nueva === mia) return { texto: mia, choques: 0 };
        const B = base.split('\n'), M = mia.split('\n'), N = nueva.split('\n');
        if ((B.length + 1) * (Math.max(M.length, N.length) + 1) > 4000000) return { texto: mia, choques: 1 };
        const hm = tramos(B, M), hn = tramos(B, N);
        const choca = (a, b) => a.bs < b.be && b.bs < a.be;
        const aplicar = (ini, fin, hs) => {
            const r = []; let p = ini;
            hs.forEach(h => { for (; p < h.bs; p++) r.push(B[p]); r.push(...h.lines); p = h.be; });
            for (; p < fin; p++) r.push(B[p]);
            return r;
        };
        const out = []; let i = 0, j = 0, pos = 0, choques = 0;
        while (i < hm.length || j < hn.length) {
            const a = hm[i], b = hn[j];
            if (a && b && choca(a, b)) {
                let ini = Math.min(a.bs, b.bs), fin = Math.max(a.be, b.be);
                const ca = [a], cb = [b]; i++; j++;
                for (let crecio = true; crecio;) {
                    crecio = false;
                    while (i < hm.length && choca(hm[i], { bs: ini, be: fin })) { ca.push(hm[i]); fin = Math.max(fin, hm[i].be); ini = Math.min(ini, hm[i].bs); i++; crecio = true; }
                    while (j < hn.length && choca(hn[j], { bs: ini, be: fin })) { cb.push(hn[j]); fin = Math.max(fin, hn[j].be); ini = Math.min(ini, hn[j].bs); j++; crecio = true; }
                }
                for (; pos < ini; pos++) out.push(B[pos]);
                const ra = aplicar(ini, fin, ca), rb = aplicar(ini, fin, cb);
                if (JSON.stringify(ra) !== JSON.stringify(rb)) choques++;
                out.push(...ra);                      // ante un choque gana la versión de la persona
                pos = fin;
            } else {
                const tomaA = a && (!b || a.bs <= b.bs);
                const h = tomaA ? a : b;
                for (; pos < h.bs; pos++) out.push(B[pos]);
                out.push(...h.lines);
                pos = h.be;
                if (tomaA) i++; else j++;
            }
        }
        for (; pos < B.length; pos++) out.push(B[pos]);
        return { texto: out.join('\n'), choques };
    }

    function fusionar(locales, base, oficiales, conflictosPrevios) {
        const L = {}, O = {};
        locales.forEach(c => { L[c.id] = c; });
        oficiales.forEach(c => { O[c.id] = c; });
        const lista = [], conf = {};
        let nuevas = 0, actualizadas = 0;
        oficiales.forEach(o => {
            const l = L[o.id], b = base ? base[o.id] : null;
            if (!l) {
                if (b) return;                       // la persona la eliminó: se respeta
                lista.push(copia(o)); nuevas++; return;
            }
            const m = Object.assign({}, l);          // conserva todo lo suyo (incluido el tono transpuesto)
            let cambio = false;
            const choques = new Set(((conflictosPrevios && conflictosPrevios[o.id]) || {}).campos || []);
            CAMPOS.forEach(k => {
                const lv = valorCampo(l, k), ov = valorCampo(o, k);
                if (lv === ov) { choques.delete(k); return; }
                if (!b) { choques.add(k); return; }  // sin copia base no se puede saber quién cambió: no se pisa nada
                const bv = valorCampo(b, k);
                if (lv === bv) { m[k] = ov; cambio = true; choques.delete(k); return; }   // la persona no tocó este dato: se actualiza al oficial
                if (ov === bv) return;                                                       // solo lo cambió la persona: se queda
                if (k === 'notas') {
                    // La letra se mezcla línea por línea: se conservan sus comentarios y resaltados y entran las correcciones oficiales
                    const r = fusionarTexto(bv, lv, ov);
                    m[k] = r.texto; cambio = true;
                    if (r.choques) choques.add(k); else choques.delete(k);
                } else choques.add(k);                                                       // los dos cambiaron lo mismo: gana lo de la persona
            });
            if (cambio) actualizadas++;
            if (choques.size) conf[o.id] = { campos: Array.from(choques), oficial: copia(sinVista([o])[0]) };
            lista.push(m);
        });
        // Canciones propias (o que ya no vienen en el archivo): se conservan siempre
        locales.forEach(l => { if (!O[l.id]) lista.push(l); });
        return { lista, conflictos: conf, resumen: { nuevas, actualizadas, conflictos: Object.keys(conf).length } };
    }

    (function cargarCanciones() {
        let local = null;
        try { local = JSON.parse(localStorage.getItem(CLAVE_LOCAL)); } catch (e) {}
        if (!local) {
            // Migración desde la versión anterior, cuando todo vivía solo en el navegador
            try {
                const viejo = JSON.parse(localStorage.getItem(CLAVE_ANTERIOR));
                if (Array.isArray(viejo) && viejo.length) {
                    local = { base: DATOS.version, canciones: viejo, dirty: JSON.stringify(sinVista(viejo)) !== JSON.stringify(DATOS.canciones) };
                }
            } catch (e) {}
        }
        if (local && Array.isArray(local.canciones)) {
            snap = local.snap || null;
            conflictos = local.conflictos || {};
            if (local.base >= DATOS.version) {
                // La copia del navegador es igual o más nueva que el archivo
                canciones = local.canciones; baseActual = local.base; dirty = !!local.dirty;
                if (!snap) snap = local.dirty ? snapDe(DATOS.canciones) : snapDe(local.canciones);
            } else {
                // El archivo trae una versión nueva: se fusiona con lo de este teléfono
                if (!snap && !local.dirty) snap = snapDe(local.canciones);   // sin cambios propios: lo que había era la versión oficial anterior
                const r = fusionar(local.canciones, snap, DATOS.canciones, conflictos);
                canciones = r.lista; conflictos = r.conflictos; resumenFusion = r.resumen;
                snap = snapDe(DATOS.canciones);
                baseActual = DATOS.version;
                dirty = JSON.stringify(sinVista(canciones)) !== JSON.stringify(sinVista(copia(DATOS.canciones)));
            }
        } else {
            snap = snapDe(DATOS.canciones);
        }
        persistirLocal();
    })();

    // ---------- Set de la semana (oficial): lo arma el administrador; cada persona puede tener su propia copia ----------
    const CLAVE_SEMANAS = 'cancionero_semanas_v1';
    const CLAVE_ADMIN_SETS = 'cancionero_admin_sets_v1';
    let copiasSem = {}, obsoletasSem = {}, snapSets = null;
    let semSel = null, semanaActual = [];

    function persistirSemanas() {
        try { localStorage.setItem(CLAVE_SEMANAS, JSON.stringify({ copias: copiasSem, obsoletas: obsoletasSem, snap: snapSets })); } catch (e) {}
    }
    (function cargarSets() {
        // Sets oficiales: los del archivo, o los que el administrador editó y todavía no publicó
        setsOficiales = copia(DATOS.sets || []);
        try {
            const a = JSON.parse(localStorage.getItem(CLAVE_ADMIN_SETS));
            if (a && Array.isArray(a.sets) && a.base >= DATOS.version) setsOficiales = a.sets;
        } catch (e) {}
        let sm = {};
        try { sm = JSON.parse(localStorage.getItem(CLAVE_SEMANAS)) || {}; } catch (e) {}
        copiasSem = sm.copias || {}; obsoletasSem = sm.obsoletas || {}; snapSets = sm.snap || null;
        const delArchivo = {};
        (DATOS.sets || []).forEach(o => { delArchivo[o.id] = o; });
        Object.keys(copiasSem).forEach(id => {
            const existe = delArchivo[id] || setsOficiales.some(o => o.id === id);
            if (!existe) { delete copiasSem[id]; delete obsoletasSem[id]; return; }
            // Si el administrador cambió el set después de que la persona hizo su copia, se le avisa (su copia no se toca)
            if (snapSets && snapSets[id] && delArchivo[id] && JSON.stringify(snapSets[id]) !== JSON.stringify(delArchivo[id].canciones)) obsoletasSem[id] = true;
        });
        snapSets = {};
        (DATOS.sets || []).forEach(o => { snapSets[o.id] = copia(o.canciones || []); });
        persistirSemanas();
    })();

    function hoyLocal() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function setsOrdenados() { return setsOficiales.slice().sort((a, b) => String(a.fecha).localeCompare(String(b.fecha))); }
    function fmtFecha(f) {
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(f || '');
        if (!m) return f || '';
        try { return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, ''); }
        catch (e) { return f; }
    }
    function setOficialActual() { return setsOficiales.find(o => o.id === semSel) || null; }
    function elegirSemanaInicial() {
        const l = setsOrdenados(); if (!l.length) return null;
        const h = hoyLocal();
        return (l.find(o => o.fecha >= h) || l[l.length - 1]).id;   // el más próximo a hoy; si ya pasaron todos, el último
    }
    const idsVigentes = ids => (ids || []).filter(id => songPorId(id));
    function cargarSemanaActual() {
        if (!setOficialActual()) semSel = elegirSemanaInicial();
        const o = setOficialActual();
        semanaActual = o ? idsVigentes(copiasSem[o.id] || o.canciones) : [];
    }
    function contarSemana() {
        const o = setOficialActual() || setsOficiales.find(x => x.id === elegirSemanaInicial());
        return o ? idsVigentes(copiasSem[o.id] || o.canciones).length : 0;
    }
    function guardarCopiaSemana() {
        const o = setOficialActual(); if (!o) return;
        if (JSON.stringify(semanaActual) === JSON.stringify(idsVigentes(o.canciones))) { delete copiasSem[o.id]; delete obsoletasSem[o.id]; }
        else copiasSem[o.id] = semanaActual.slice();
        persistirSemanas();
        actualizarEstado();
    }
    // Una canción eliminada sale de todas las listas
    function purgarId(id) {
        misIds = misIds.filter(x => x !== id);
        semanaActual = semanaActual.filter(x => x !== id);
        Object.keys(copiasSem).forEach(k => { copiasSem[k] = copiasSem[k].filter(x => x !== id); });
        persistirSemanas();
        setIds = modoSet === 'sem' ? semanaActual : misIds;
    }

    function renderSemHead() {
        const box = el('semHead'); if (!box) return;
        if (modoSet !== 'sem') { box.innerHTML = ''; return; }
        const o = setOficialActual();
        if (!o) { box.innerHTML = '<div class="empty">Todavía no hay un set de la semana.</div>'; return; }
        const mod = !!copiasSem[o.id];
        box.innerHTML = `<div class="sem-head">
            <select id="semSelect" onchange="elegirSemana(this.value)" aria-label="Elegir la fecha del set">${setsOrdenados().map(x => `<option value="${escapeHtml(x.id)}" ${x.id === o.id ? 'selected' : ''}>${escapeHtml(fmtFecha(x.fecha))} · ${escapeHtml(x.nombre || 'Set')}</option>`).join('')}</select>
            <div class="fila"><button onclick="abrirPicker('semana')">＋ Agregar canción</button>${mod ? '<button onclick="restaurarSemana()">↺ Restaurar el oficial</button>' : ''}</div>
            ${mod ? `<div class="aviso-sem">${obsoletasSem[o.id] ? '⚠ El administrador actualizó este set y tú tienes tu propia versión. Toca "Restaurar el oficial" para ver la nueva.' : 'Modificaste este set. Tu versión se queda solo en este teléfono.'}</div>` : ''}
        </div>`;
    }
    function elegirSemana(id) {
        semSel = id; cargarSemanaActual(); setIds = semanaActual;
        cur = 0; curGuardado.sem = 0;
        renderSet();
    }
    function restaurarSemana() {
        const o = setOficialActual(); if (!o) return;
        if (!confirm('Se descartan tus cambios y se vuelve al set que armó el administrador. ¿Continuar?')) return;
        delete copiasSem[o.id]; delete obsoletasSem[o.id];
        persistirSemanas();
        cargarSemanaActual(); setIds = semanaActual;
        cur = 0;
        renderSet();
        aviso('Set oficial restaurado');
    }

    // ---------- Selector de canciones (para el set de la semana y para el editor de sets oficiales) ----------
    let pickerDestino = null;
    function ov(id, on) {
        el(id).classList.toggle('open', on);
        document.body.classList.toggle('noscroll', !!document.querySelector('.editor.open, .escena.open'));
    }
    function listaPicker() { return pickerDestino === 'semana' ? semanaActual : (setEdTmp ? setEdTmp.canciones : []); }
    function abrirPicker(destino) {
        pickerDestino = destino;
        el('pickBuscar').value = '';
        renderPicker();
        ov('picker', true);
    }
    function renderPicker() {
        const q = el('pickBuscar').value.toLowerCase().trim();
        const dentro = listaPicker();
        const lista = canciones.filter(s => s.titulo.toLowerCase().includes(q))
            .sort((a, b) => a.titulo.localeCompare(b.titulo, 'es', { sensitivity: 'base', numeric: true }));
        el('pickLista').innerHTML = lista.length ? lista.map(s => {
            const p = partesTitulo(s.titulo), on = dentro.includes(s.id);
            return `<div class="set-row pick ${on ? 'on' : ''}" onclick="alternarEnPicker(${s.id})"><span class="ck">${on ? '✓' : ''}</span><span class="nm">${escapeHtml(p.main)}<small>${escapeHtml([p.sub, fmtTono(s.tono)].filter(Boolean).join(' · '))}</small></span></div>`;
        }).join('') : '<div class="empty">No hay canciones que coincidan.</div>';
    }
    function alternarEnPicker(id) {
        const l = listaPicker(), i = l.indexOf(id);
        if (i >= 0) l.splice(i, 1); else l.push(id);
        if (pickerDestino === 'semana') guardarCopiaSemana();
        renderPicker();
    }
    function cerrarPicker() {
        ov('picker', false);
        if (pickerDestino === 'semana') renderSet(); else renderSetEd();
    }

    let misIds = [];
    try { misIds = (JSON.parse(localStorage.getItem(CLAVE_SET)) || []).filter(id => canciones.some(s => s.id === id)); } catch (e) {}
    let setIds = misIds;              // lista activa: la de "Mi set" o la del set de la semana
    let modoSet = 'mio';              // 'mio' | 'sem'
    const curGuardado = { mio: 0, sem: 0 };

    let prefs = { tam: 17, ajuste: false, tema: 'oscuro' };
    try { prefs = Object.assign(prefs, JSON.parse(localStorage.getItem(CLAVE_PREFS)) || {}); } catch (e) {}

    let cur = 0;
    let vista = 'lib';
    let editor = { id: null, base: null, redo: [] };

    // ---------- Utilidades ----------
    function escapeHtml(t) {
        return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function persistirLocal() {
        try { localStorage.setItem(CLAVE_LOCAL, JSON.stringify({ base: baseActual, dirty: dirty, canciones: canciones, snap: snap, conflictos: conflictos })); } catch (e) {}
    }
    // soloVista = true cuando el cambio no forma parte del archivo (por ejemplo el tono T+ / T−)
    function guardar(soloVista) {
        if (!soloVista) dirty = true;
        persistirLocal();
        actualizarEstadoArchivo();
    }

    // En Chrome/Edge de computadora se puede guardar sobre el mismo archivo. En teléfono se descarga una copia.
    const PUEDE_SOBRESCRIBIR = typeof window.showSaveFilePicker === 'function';
    const EN_LINEA = /^https?:$/.test(location.protocol);   // true cuando está publicado en internet
    // Nombre con el que se guarda o descarga: el del propio archivo, o index.html cuando está publicado
    const NOMBRE_ARCHIVO = (function () {
        try { const n = decodeURIComponent(location.pathname.split('/').pop() || ''); return /\.html?$/i.test(n) ? n : 'index.html'; }
        catch (e) { return 'index.html'; }
    })();
    const ETIQUETA_GUARDAR = PUEDE_SOBRESCRIBIR ? '💾 Guardar' : '⬇ HTML';
    let archivoNombre = '';

    function actualizarEstadoArchivo() {
        const e = el('estadoArchivo');
        if (e) {
            e.className = 'hint estado ' + (dirty ? 'pend' : 'ok');
            e.textContent = dirty
                ? (EN_LINEA
                    ? '● Hay cambios que solo están en este dispositivo. Para publicarlos toca ' + ETIQUETA_GUARDAR + ' (arriba) y sube el archivo ' + NOMBRE_ARCHIVO + ' a tu sitio.'
                    : '● Hay cambios que solo están en este navegador. Toca ' + ETIQUETA_GUARDAR + ' (arriba) para guardarlos en el archivo.')
                : '✔ Todo está guardado en el archivo HTML' + (archivoNombre ? ' (' + archivoNombre + ')' : '') + '.';
        }
        const d = el('dotHtml');
        if (d) d.style.display = dirty ? 'inline-block' : 'none';
        const b = el('txtGuardar');
        if (b) b.textContent = ETIQUETA_GUARDAR;
    }

    function marcarGuardado(version) {
        baseActual = version;
        dirty = false;
        snap = snapDe(canciones);      // lo que acaba de guardarse en el archivo pasa a ser la versión oficial de este teléfono
        conflictos = {};
        persistirLocal();
        actualizarEstadoArchivo();
    }

    // Memoria del archivo elegido (IndexedDB), para no volver a pedirlo en cada sesión
    function idbAbrir() {
        return new Promise((ok, mal) => {
            const r = indexedDB.open('cancionero_archivo', 1);
            r.onupgradeneeded = () => r.result.createObjectStore('h');
            r.onsuccess = () => ok(r.result);
            r.onerror = () => mal(r.error);
        });
    }
    async function idbLeer(k) {
        const db = await idbAbrir();
        return new Promise((ok, mal) => { const q = db.transaction('h').objectStore('h').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => mal(q.error); });
    }
    async function idbEscribir(k, v) {
        const db = await idbAbrir();
        return new Promise((ok, mal) => { const t = db.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = () => ok(); t.onerror = () => mal(t.error); });
    }

    // Guarda sobre el MISMO archivo (sin copias). Si el navegador no lo permite, descarga el HTML.
    async function guardarEnArchivo() {
        const r = construirHtml();
        if (!r) { aviso('No se pudo generar el archivo'); return; }
        if (!PUEDE_SOBRESCRIBIR) { descargarHtml(); return; }
        let handle = null;
        try { handle = await idbLeer('archivo'); } catch (e) {}
        try {
            if (handle) {
                let perm = await handle.queryPermission({ mode: 'readwrite' });
                if (perm !== 'granted') perm = await handle.requestPermission({ mode: 'readwrite' });
                if (perm !== 'granted') handle = null;
            }
            if (!handle) {
                aviso('Elige tu archivo "' + NOMBRE_ARCHIVO + '" para guardar sobre él', 5000);
                handle = await window.showSaveFilePicker({
                    suggestedName: NOMBRE_ARCHIVO,
                    types: [{ description: 'Página HTML', accept: { 'text/html': ['.html', '.htm'] } }]
                });
                try { await idbEscribir('archivo', handle); } catch (e) {}
            }
            const w = await handle.createWritable();
            await w.write(new Blob([r.html], { type: 'text/html;charset=utf-8' }));
            await w.close();
            archivoNombre = handle.name || '';
            marcarGuardado(r.version);
            aviso('✔ Guardado en ' + (archivoNombre || 'el archivo'));
        } catch (e) {
            if (e && e.name === 'AbortError') return;   // el usuario canceló
            aviso('No se pudo escribir en el archivo. Se descargó una copia.', 5000);
            descargarHtml(true);
        }
    }

    // Genera el HTML completo con las canciones actuales dentro del bloque de datos
    function construirHtml() {
        const datos = { version: Date.now(), canciones: sinVista(canciones), sets: setsOficiales };
        const json = JSON.stringify(datos, null, 1)
            .replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
        const re = /(<script id="datos-canciones"[^>]*>)[\s\S]*?(<\/script>)/;
        if (!re.test(FUENTE_INICIAL)) return null;
        return {
            version: datos.version,
            html: '<!DOCTYPE html>\n' + FUENTE_INICIAL.replace(re, (m, a, b) => a + '\n' + json + '\n' + b)
        };
    }

    function descargarHtml(silencio) {
        const r = construirHtml();
        if (!r) { aviso('No se pudo generar el archivo'); return; }
        const blob = new Blob([r.html], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = NOMBRE_ARCHIVO;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        marcarGuardado(r.version);
        if (!silencio) aviso('Listo: reemplaza tu archivo por el que se descargó (' + NOMBRE_ARCHIVO + ').', 6500);
    }
    function guardarSet() {
        if (modoSet === 'sem') { guardarCopiaSemana(); return; }
        try { localStorage.setItem(CLAVE_SET, JSON.stringify(misIds)); } catch (e) {}
    }
    function songPorId(id) { return canciones.find(s => s.id === id); }

    let toastTimer;
    function aviso(msg, ms) {
        const t = el('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), ms || 2300);
    }

    // Cómo se ve el tono en las listas: solo la primera letra en mayúscula (C#M → C#m, DM → Dm, SIM → Sim). El dato guardado no cambia.
    function fmtTono(t) { t = String(t || '').trim(); return t ? t.charAt(0).toUpperCase() + t.slice(1).toLowerCase() : ''; }
    function partesTitulo(t) {
        const i = t.indexOf(' - ');
        return i < 0 ? { main: t, sub: '' } : { main: t.slice(0, i), sub: t.slice(i + 3) };
    }

    // ---------- Acordes: reconocimiento y transposición ----------
    // Escala cromática (con sostenidos) en notación latina e inglesa
    const ESC_LAT = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];
    const ESC_ING = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const IDX_LAT = { do: 0, re: 2, mi: 4, fa: 5, sol: 7, la: 9, si: 11 };
    const IDX_ING = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

    // Un acorde = RAIZ + ALTERACIÓN (# o b) + CALIDAD (m, maj, dim, sus, add, 5, 7, 9, b5, (add9)...)
    const RAIZ = '(DO|RE|MI|FA|SOL|LA|SI|Do|Re|Mi|Fa|Sol|La|Si|[A-G])';
    const ALTERA = '([#b\u266F\u266D]?)';
    const CALIDAD = '((?:maj|min|dim|aug|sus|add|m|M|[\u00B0\u00BA+]|[#b\u266F\u266D]?\\d+|\\([^)]*\\))*)';
    const PARTE_ACORDE = new RegExp('^' + RAIZ + ALTERA + CALIDAD + '$');
    // Símbolos que pueden ir entre acordes:  /  ,  -  |
    const SEPARADORES = /[\/,\-\u2013\u2014|]+/;
    const SOLO_SEPARADORES = /^[\/,\-\u2013\u2014|]+$/;

    // Marcas de repetición que suelen ir en las líneas de acordes: x2, (x2), 2x
    const REPETICION = /^[(\[]?(?:[xX]\d+|\d+[xX])[)\]]?$/;

    // Una línea es de acordes si TODAS sus palabras son acordes, símbolos separadores o marcas de repetición (y hay al menos un acorde)
    function esLineaAcordes(raw) {
        let hay = false;
        for (const t of raw.trim().split(/\s+/)) {
            if (SOLO_SEPARADORES.test(t) || REPETICION.test(t)) continue;
            const partes = t.split(SEPARADORES).filter(Boolean);
            // el primero debe ser un acorde; los siguientes, otro acorde o un número (Re7/9)
            if (!partes.length || !PARTE_ACORDE.test(partes[0])) return false;
            if (!partes.every((p, i) => PARTE_ACORDE.test(p) || (i > 0 && /^\d+$/.test(p)))) return false;
            hay = true;
        }
        return hay;
    }

    // Sube o baja n semitonos la raíz de un acorde y conserva todo lo demás (m, 7, sus, add9...)
    function transponerParte(p, n) {
        const m = PARTE_ACORDE.exec(p);
        if (!m) return p;
        const raiz = m[1], alt = m[2], resto = m[3];
        const latino = raiz.length > 1;
        const mayusc = latino && raiz === raiz.toUpperCase();
        const base = latino ? IDX_LAT[raiz.toLowerCase()] : IDX_ING[raiz];
        const desp = (alt === '#' || alt === '\u266F') ? 1 : (alt === 'b' || alt === '\u266D') ? -1 : 0;
        const v = (((base + desp + n) % 12) + 12) % 12;
        let nombre = latino ? ESC_LAT[v] : ESC_ING[v];
        if (mayusc) nombre = nombre.toUpperCase();
        return nombre + resto;
    }

    // Transpone cada acorde de una palabra (por ejemplo DO/A o DO-RE) respetando los símbolos
    function transponerToken(tok, n) {
        return tok.replace(/[^\/,\-\u2013\u2014|]+/g, p => transponerParte(p, n));
    }

    // ---------- Texto con estilos: negrita **texto** y resaltado {{1:texto}} (colores 1 a 6) ----------
    // Convierte una línea con marcas en caracteres visibles con su estilo, y recuerda dónde empezó cada uno
    const RE_HL = /\{\{([1-6]):/y;
    function parsearLinea(l) {
        const chars = [], pos = [];
        const total = (l.match(/\*\*/g) || []).length;
        const suelto = total % 2 ? l.lastIndexOf('**') : -1; // un ** sin pareja se muestra tal cual
        let b = false, h = 0, i = 0;
        while (i < l.length) {
            if (i !== suelto && l.startsWith('**', i)) { b = !b; i += 2; continue; }
            RE_HL.lastIndex = i;
            const m = RE_HL.exec(l);
            if (m) { h = +m[1]; i += m[0].length; continue; }
            if (h && l.startsWith('}}', i)) { h = 0; i += 2; continue; }
            chars.push({ c: l[i], b: b, h: h });
            pos.push(i);
            i++;
        }
        return { chars, pos };
    }

    // Vuelve a escribir las marcas a partir de los caracteres con estilo
    function serializarLinea(chars) {
        let s = '', b = false, h = 0;
        const pos = [];
        for (const x of chars) {
            if (h && x.h !== h) { s += '}}'; h = 0; }
            if (x.b !== b) { s += '**'; b = x.b; }
            if (x.h && x.h !== h) { s += '{{' + x.h + ':'; h = x.h; }
            pos.push(s.length);
            s += x.c;
        }
        if (h) s += '}}';
        if (b) s += '**';
        return { texto: s, pos };
    }

    function charsAHtml(chars) {
        let out = '', i = 0;
        while (i < chars.length) {
            let j = i;
            while (j < chars.length && chars[j].b === chars[i].b && chars[j].h === chars[i].h) j++;
            let seg = escapeHtml(chars.slice(i, j).map(x => x.c).join(''));
            if (chars[i].b) seg = '<strong>' + seg + '</strong>';
            if (chars[i].h) seg = '<mark class="hl hl' + chars[i].h + '">' + seg + '</mark>';
            out += seg;
            i = j;
        }
        return out;
    }

    // Transpone una línea de acordes (con estilos) intentando mantener cada acorde en su columna
    function transponerChars(chars, n) {
        const plano = chars.map(x => x.c).join('');
        const re = /\S+/g;
        const out = [];
        const estiloEn = i => { const x = chars[Math.min(i, chars.length - 1)]; return { b: x.b, h: x.h }; };
        let m;
        while ((m = re.exec(plano))) {
            while (out.length < m.index) { const e = estiloEn(out.length); out.push({ c: ' ', b: e.b, h: e.h }); }
            if (out.length > 0 && out[out.length - 1].c !== ' ') { const e = estiloEn(m.index - 1); out.push({ c: ' ', b: e.b, h: e.h }); }
            const e = chars[m.index];
            for (const ch of transponerToken(m[0], n)) out.push({ c: ch, b: e.b, h: e.h });
        }
        return out;
    }

    // Tono de la canción ya transpuesto (SIM = Si menor)
    function tonoTranspuesto(tono, n) {
        if (!tono || !n) return tono;
        return transponerParte(tono.replace(/M$/, 'm'), n);
    }

    function renderLetra(txt, n) {
        if (!txt) return '';
        return txt.split('\n').map(l => {
            const { chars } = parsearLinea(l);
            const plano = chars.map(x => x.c).join('');
            const raw = plano.trim();
            if (!raw) return charsAHtml(chars);

            // Sección sola en su línea: [Coro]
            if (/^\[.*\]$/.test(raw)) {
                const ini = plano.length - plano.trimStart().length;
                return '<span class="sec">' + charsAHtml(chars.slice(ini, ini + raw.length)) + '</span>';
            }
            // Sección seguida de acordes en la misma línea: [Intro] Re  La  Sol
            const mx = /^(\s*\[[^\]]*\])(\s+\S.*)$/.exec(plano);
            if (mx && esLineaAcordes(mx[2])) {
                const ini = mx[1].length - mx[1].trimStart().length;
                let resto = chars.slice(mx[1].length);
                if (n) resto = transponerChars(resto, n);
                return '<span class="sec">' + charsAHtml(chars.slice(ini, mx[1].length)) + '</span><span class="ch">' + charsAHtml(resto) + '</span>';
            }
            // Línea de acordes
            if (esLineaAcordes(raw)) {
                return '<span class="ch">' + charsAHtml(n ? transponerChars(chars, n) : chars) + '</span>';
            }
            return charsAHtml(chars);
        }).join('\n');
    }

    // ---------- Navegación ----------
    function esVistaSet() { return vista === 'set' || vista === 'sem'; }
    function irA(v) {
        if (v === 'sem' && !setsOficiales.length) v = 'lib';
        curGuardado[modoSet] = cur;
        modoSet = v === 'sem' ? 'sem' : 'mio';
        if (modoSet === 'sem') { cargarSemanaActual(); setIds = semanaActual; } else setIds = misIds;
        cur = curGuardado[modoSet] || 0;
        vista = v;
        document.body.classList.toggle('lib', v === 'lib');
        document.body.classList.toggle('set', v !== 'lib');
        document.body.classList.toggle('sem', v === 'sem');
        el('viewLib').classList.toggle('on', v === 'lib');
        el('viewSet').classList.toggle('on', v !== 'lib');
        el('tabLib').classList.toggle('on', v === 'lib');
        el('tabSem').classList.toggle('on', v === 'sem');
        el('tabSet').classList.toggle('on', v === 'set');
        if (v !== 'lib') renderSet(); else renderLib();
        window.scrollTo(0, 0);
    }

    function actualizarEstado() {
        el('setCount').textContent = misIds.length;
        const haySem = setsOficiales.length > 0;
        el('tabSem').style.display = haySem ? '' : 'none';
        el('seg').classList.toggle('tres', haySem);
        el('semCount').textContent = contarSemana();
        el('playN').textContent = '· ' + setIds.length;
        document.body.classList.toggle('hasset', setIds.length > 0);
    }

    // ---------- Biblioteca ----------
    function renderLib() {
        const q = el('search').value.toLowerCase().trim();
        const lista = canciones.filter(s => s.titulo.toLowerCase().includes(q))
            .sort((a, b) => a.titulo.localeCompare(b.titulo, 'es', { sensitivity: 'base', numeric: true }));
        const grid = el('grid');
        if (lista.length === 0) {
            grid.innerHTML = '<div class="empty" style="grid-column:1/-1">No hay canciones que mostrar.<br>Usa ＋ para agregar una.</div>';
        } else {
            grid.innerHTML = lista.map(s => {
                const pos = misIds.indexOf(s.id);
                const p = partesTitulo(s.titulo);
                return `
                <div class="tile ${pos >= 0 ? 'on' : ''}" onclick="alternarEnSet(${s.id})">
                    <span class="tick">${pos >= 0 ? pos + 1 : ''}</span>
                    <span class="tt txt">${escapeHtml(p.main)}${p.sub ? `<span class="sub">${escapeHtml(p.sub)}</span>` : ''}</span>
                    <span class="key">${escapeHtml(fmtTono(s.tono) || '—')}</span>
                    <button class="mini" onclick="event.stopPropagation();abrirEditor(${s.id})" aria-label="Editar">✎</button>
                </div>`;
            }).join('');
        }
        actualizarEstado();
    }

    function alternarEnSet(id) {
        const i = misIds.indexOf(id);
        if (i >= 0) misIds.splice(i, 1); else misIds.push(id);
        guardarSet();
        renderLib();
    }

    // ---------- Mi set ----------
    function renderSet() {
        actualizarEstado();
        renderSemHead();
        const box = el('stageBox');
        if (setIds.length === 0) {
            el('chips').innerHTML = '';
            box.innerHTML = modoSet === 'sem'
                ? `<div class="empty">Este set no tiene canciones.<br>Usa "＋ Agregar canción" para armar tu versión.</div>`
                : `<div class="empty">Tu set está vacío.<br>Elige canciones en la Biblioteca.<br><button class="btn-acc" onclick="irA('lib')">Ir a la Biblioteca</button></div>`;
            return;
        }
        if (cur >= setIds.length) cur = setIds.length - 1;
        if (cur < 0) cur = 0;

        el('chips').innerHTML = setIds.map((id, i) => {
            const s = songPorId(id);
            return `<button class="chip ${i === cur ? 'on' : ''}" onclick="irAIndice(${i})">${i + 1} · ${escapeHtml(partesTitulo(s.titulo).main)}</button>`;
        }).join('');

        const s = songPorId(setIds[cur]);
        const p = partesTitulo(s.titulo);
        const t = s.trans || 0;
        box.innerHTML = `
            <article class="stage ${prefs.ajuste ? 'wrap' : ''}" id="stage">
                <div class="s-top">
                    <div class="s-num">${String(cur + 1).padStart(2, '0')}</div>
                    <div class="s-title">
                        <h2>${escapeHtml(p.main)}</h2>
                        ${p.sub ? `<small>${escapeHtml(p.sub)}</small>` : ''}
                        ${s.tono ? `<span class="badge">TONO ${escapeHtml(tonoTranspuesto(s.tono, t))}${t ? ` <span style="font-weight:700;opacity:.75;letter-spacing:0">(${t > 0 ? '+' : ''}${t} · orig. ${escapeHtml(s.tono)})</span>` : ''}</span>` : ''}
                    </div>
                </div>
                <div class="s-order">
                    <button onclick="moverEnSet(-1)" ${cur === 0 ? 'disabled' : ''}>⇦ Antes</button>
                    <button onclick="moverEnSet(1)" ${cur === setIds.length - 1 ? 'disabled' : ''}>Después ⇨</button>
                    <button class="rm" onclick="quitarActual()">Quitar</button>
                </div>
                <details class="notes" ${s.comentario ? 'open' : ''}>
                    <summary>📝 Notas</summary>
                    <div class="note-tools">
                        <button class="btn-b" onmousedown="event.preventDefault()" onclick="document.execCommand('bold')" aria-label="Negrita">B</button>
                        <small>Selecciona texto y pulsa B</small>
                    </div>
                    <div class="note-ed" contenteditable="true" data-ph="Escribe una nota…" onpaste="pegarPlano(event)" oninput="notaInput(${s.id}, this)">${s.comentario || ''}</div>
                </details>
                <pre class="lyrics">${renderLetra(s.notas, t)}</pre>
            </article>`;

        el('pos').textContent = `${cur + 1}/${setIds.length}`;
        el('btnPrev').disabled = cur === 0;
        el('btnNext').disabled = cur === setIds.length - 1;

        const act = document.querySelector('.chip.on');
        if (act) act.scrollIntoView({ inline: 'center', block: 'nearest' });
    }

    function irAIndice(i) { cur = i; renderSet(); window.scrollTo(0, 0); }
    function mover(d) {
        const n = cur + d;
        if (n < 0 || n >= setIds.length) return;
        cur = n; renderSet(); window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function moverEnSet(d) {
        const n = cur + d;
        if (n < 0 || n >= setIds.length) return;
        [setIds[cur], setIds[n]] = [setIds[n], setIds[cur]];
        cur = n; guardarSet(); renderSet();
    }

    function quitarActual() {
        setIds.splice(cur, 1);
        guardarSet();
        renderSet();
        aviso('Quitada del set');
    }

    function notaInput(id, div) {
        const s = songPorId(id);
        if (!s) return;
        s.comentario = (div.innerHTML === '<br>') ? '' : div.innerHTML;
        guardar();
    }
    function pegarPlano(e) {
        e.preventDefault();
        document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
    }

    // Preferencias de lectura
    function aplicarPrefs() {
        document.documentElement.style.setProperty('--lyrics-size', prefs.tam + 'px');
        const claro = prefs.tema === 'claro';
        if (claro) document.documentElement.setAttribute('data-tema', 'claro'); else document.documentElement.removeAttribute('data-tema');
        const mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', claro ? '#faf6ec' : '#15130f');
        const bt = el('btnTema'); if (bt) bt.textContent = claro ? '🌙' : '☀';
        const st = el('stage'); if (st) st.classList.toggle('wrap', prefs.ajuste);
        const es = el('escena'); if (es) es.classList.toggle('wrap', prefs.ajuste);
        try { localStorage.setItem(CLAVE_PREFS, JSON.stringify(prefs)); } catch (e) {}
    }
    // Herramientas de tono y tamaño: emergentes para no tapar la letra
    function alternarHerramientas(abrir) {
        const r = el('rail'); if (!r) return;
        const on = typeof abrir === 'boolean' ? abrir : !r.classList.contains('open');
        r.classList.toggle('open', on);
        el('railToggle').textContent = on ? '✕' : 'Aa';
        el('railToggle').setAttribute('aria-expanded', on ? 'true' : 'false');
    }
    // Tocar fuera de las herramientas las vuelve a ocultar
    document.addEventListener('click', e => {
        const r = el('rail');
        if (r && r.classList.contains('open') && !r.contains(e.target)) alternarHerramientas(false);
    });
    function alternarTema() {
        prefs.tema = prefs.tema === 'claro' ? 'oscuro' : 'claro';
        aplicarPrefs();
    }
    function cambiarTamano(d) {
        prefs.tam = Math.min(32, Math.max(11, prefs.tam + d));
        aplicarPrefs();
        aviso('Letra: ' + prefs.tam + ' px');
    }
    function alternarAjuste() {
        prefs.ajuste = !prefs.ajuste;
        aplicarPrefs();
        aviso(prefs.ajuste ? 'Líneas ajustadas al ancho' : 'Líneas sin ajustar (desliza de lado)');
    }

    // Cambiar de tono: T+ sube medio tono y T− lo baja (se recuerda por canción)
    function cambiarTono(d) {
        if (!setIds.length) return;
        const s = songPorId(setIds[cur]);
        let t = (s.trans || 0) + d;
        if (Math.abs(t) >= 12) t = 0; // 12 semitonos = el mismo tono
        s.trans = t;
        guardar(true);
        renderSet();
        if (escenaAbierta()) renderEscena();
        const signo = t > 0 ? '+' : '';
        aviso('Tono: ' + (s.tono ? tonoTranspuesto(s.tono, t) + ' ' : '') + (t ? '(' + signo + t + ')' : '(original)'));
    }

    // Deslizar a los lados para cambiar de canción
    (function () {
        let x0 = 0, y0 = 0, ignorar = false;
        const box = el('viewSet');
        box.addEventListener('touchstart', e => {
            const pre = e.target.closest('pre');
            ignorar = !!(pre && pre.scrollWidth > pre.clientWidth) || !!e.target.closest('.chips, .note-ed');
            x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
        }, { passive: true });
        box.addEventListener('touchend', e => {
            if (ignorar || vista !== 'set') return;
            const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
            if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.8) mover(dx < 0 ? 1 : -1);
        }, { passive: true });
    })();

    // ---------- Importar canciones desde otro archivo del cancionero ----------
    // Deja solo formato básico en los comentarios (negrita, saltos de línea); lo demás se convierte en texto.
    function limpiarComentario(html) {
        const permitido = new Set(['B', 'STRONG', 'I', 'EM', 'BR', 'DIV', 'SPAN', 'P']);
        const plantilla = document.createElement('template');
        plantilla.innerHTML = String(html || '');
        const limpiar = nodo => {
            const frag = document.createDocumentFragment();
            nodo.childNodes.forEach(h => {
                if (h.nodeType === 3) frag.appendChild(document.createTextNode(h.textContent));
                else if (h.nodeType === 1) {
                    if (h.tagName === 'SCRIPT' || h.tagName === 'STYLE') return;
                    if (permitido.has(h.tagName)) {
                        const e = document.createElement(h.tagName.toLowerCase());
                        e.appendChild(limpiar(h));
                        frag.appendChild(e);
                    } else frag.appendChild(limpiar(h));
                }
            });
            return frag;
        };
        const cont = document.createElement('div');
        cont.appendChild(limpiar(plantilla.content));
        return cont.innerHTML;
    }

    async function importarDesdeArchivo(input) {
        const f = input.files && input.files[0];
        input.value = '';
        if (!f) return;
        let txt;
        try { txt = await f.text(); } catch (e) { aviso('No se pudo leer el archivo'); return; }
        let lista = null;
        const m = txt.match(/<script id="datos-canciones"[^>]*>([\s\S]*?)<\/script>/);
        try {
            if (m) lista = JSON.parse(m[1]).canciones;
            else { const j = JSON.parse(txt); lista = Array.isArray(j) ? j : j.canciones; }
        } catch (e) {}
        if (!Array.isArray(lista) || !lista.length) { aviso('Ese archivo no tiene canciones del cancionero', 4500); return; }

        const validas = [];
        lista.forEach(c => {
            if (!c || typeof c.titulo !== 'string' || !c.titulo.trim() || typeof c.id !== 'number' || !isFinite(c.id)) return;
            validas.push({
                id: c.id,
                titulo: c.titulo.trim().slice(0, 200),
                tono: typeof c.tono === 'string' ? c.tono.trim().toUpperCase().slice(0, 10) : '',
                comentario: typeof c.comentario === 'string' ? limpiarComentario(c.comentario.slice(0, 50000)) : '',
                notas: typeof c.notas === 'string' ? c.notas.slice(0, 200000) : ''
            });
        });
        if (!validas.length) { aviso('No se encontraron canciones válidas', 4500); return; }

        const nuevas = [], cambiadas = [];
        validas.forEach(c => {
            const ya = songPorId(c.id);
            if (!ya) nuevas.push(c);
            else if (ya.titulo !== c.titulo || ya.tono !== c.tono || ya.notas !== c.notas || ya.comentario !== c.comentario) cambiadas.push(c);
        });
        if (!nuevas.length && !cambiadas.length) { aviso('Ya tienes todas esas canciones tal cual', 4500); return; }

        if (!confirm('El archivo trae ' + validas.length + ' canciones: ' + nuevas.length + ' nuevas y ' + cambiadas.length + ' con cambios respecto a las que tienes.\n\nAceptar: agregar las nuevas y reemplazar las que cambiaron.\nCancelar: no importar nada.')) return;

        nuevas.forEach(c => canciones.push(c));
        cambiadas.forEach(c => { const i = canciones.findIndex(x => x.id === c.id); canciones[i] = Object.assign({}, canciones[i], c); });
        guardar();
        if (esVistaSet()) renderSet(); else renderLib();
        aviso('Importadas: ' + nuevas.length + ' nuevas y ' + cambiadas.length + ' actualizadas', 5000);
    }

    // Aplica un estilo (negrita o resaltado) a todo el texto seleccionado, sea una línea o varias.
    // decidir(seleccionados) calcula el valor a aplicar; aplicar(caracter, valor) lo escribe.
    function modificarSeleccion(decidir, aplicar) {
        const ta = el('edTexto');
        const a = ta.selectionStart, b = ta.selectionEnd;
        if (a === b) return false;

        let off = 0;
        const info = ta.value.split('\n').map(l => {
            const ini = off, fin = off + l.length;
            off = fin + 1;
            const { chars, pos } = parsearLinea(l);
            let idx = [];
            if (a < fin && b > ini) {
                const rs = Math.max(a, ini) - ini, re = Math.min(b, fin) - ini;
                chars.forEach((x, i) => { if (pos[i] >= rs && pos[i] < re) idx.push(i); });
                if (!idx.some(i => chars[i].c.trim() !== '')) idx = []; // se ignoran las líneas en blanco
            }
            return { l, chars, idx };
        });

        const sel = [];
        info.forEach(x => x.idx.forEach(i => sel.push(x.chars[i])));
        if (!sel.length) return false;
        const valor = decidir(sel.filter(c => c.c.trim() !== ''));

        let nuevoOff = 0, selIni = -1, selFin = -1;
        const salida = info.map(x => {
            let res = x.l;
            if (x.idx.length) {
                x.idx.forEach(i => aplicar(x.chars[i], valor));
                const s = serializarLinea(x.chars);
                res = s.texto;
                if (selIni < 0) selIni = nuevoOff + s.pos[x.idx[0]];
                selFin = nuevoOff + s.pos[x.idx[x.idx.length - 1]] + 1;
            }
            nuevoOff += res.length + 1;
            return res;
        });

        const st = ta.scrollTop;
        ta.value = salida.join('\n');
        ta.focus();
        ta.setSelectionRange(selIni, selFin);
        ta.scrollTop = st;
        editorCambio();
        return true;
    }

    function negritaLetra() {
        const ta = el('edTexto');
        if (ta.selectionStart === ta.selectionEnd) { aviso('Selecciona primero el texto'); return; }
        // si todo lo seleccionado ya está en negrita se la quita; si no, se la pone
        modificarSeleccion(sel => !sel.every(c => c.b), (c, v) => { c.b = v; });
    }

    function alternarPaleta() {
        el('hlPal').classList.toggle('open');
    }

    function resaltar(color) {
        const ta = el('edTexto');
        if (ta.selectionStart === ta.selectionEnd) { aviso('Selecciona primero el texto que quieres resaltar'); return; }
        modificarSeleccion(() => color, (c, v) => { c.h = v; });
    }

    // Quita el resaltado del texto seleccionado (una o varias líneas).
    // Sin selección, quita el resaltado que esté justo donde está el cursor.
    function quitarResaltado() {
        const ta = el('edTexto');
        if (ta.selectionStart !== ta.selectionEnd) {
            if (!modificarSeleccion(() => 0, (c, v) => { c.h = v; })) aviso('No hay texto para quitar el resaltado');
            return;
        }
        const t = ta.value, cur = ta.selectionStart;
        const ini = cur === 0 ? 0 : t.lastIndexOf('\n', cur - 1) + 1;
        let fin = t.indexOf('\n', cur);
        if (fin < 0) fin = t.length;
        const { chars, pos } = parsearLinea(t.slice(ini, fin));
        let k = -1;
        for (let i = 0; i < chars.length; i++) if (pos[i] < cur - ini) k = i;
        const c = [k, k + 1].find(i => i >= 0 && i < chars.length && chars[i].h);
        if (c === undefined) { aviso('No hay resaltado aquí. Selecciona el texto para quitarlo.'); return; }
        const color = chars[c].h;
        let i0 = c, i1 = c;
        while (i0 > 0 && chars[i0 - 1].h === color) i0--;
        while (i1 < chars.length - 1 && chars[i1 + 1].h === color) i1++;
        for (let i = i0; i <= i1; i++) chars[i].h = 0;
        const s = serializarLinea(chars);
        const st = ta.scrollTop;
        ta.value = t.slice(0, ini) + s.texto + t.slice(fin);
        ta.focus();
        ta.setSelectionRange(ini + s.pos[i0], ini + s.pos[i0]);
        ta.scrollTop = st;
        editorCambio();
    }

    // Quita todo el resaltado de la canción que se está editando
    function quitarTodoResaltado() {
        const ta = el('edTexto');
        const antes = ta.value;
        const nuevo = antes.split('\n').map(l => {
            const { chars } = parsearLinea(l);
            if (!chars.some(c => c.h)) return l;
            chars.forEach(c => { c.h = 0; });
            return serializarLinea(chars).texto;
        }).join('\n');
        if (nuevo === antes) { aviso('No hay resaltado en esta canción'); return; }
        const st = ta.scrollTop;
        ta.value = nuevo;
        ta.scrollTop = st;
        editorCambio();
        aviso('Resaltado quitado');
    }

    // Limpia lo que traen los textos copiados de páginas web: saltos de línea de Windows, espacios especiales y tabuladores
    function normalizarTexto(t) {
        return t.replace(/\r\n?/g, '\n').replace(/[   ]/g, ' ').replace(/[​﻿]/g, '').replace(/\t/g, '    ');
    }

    function guardarEditor() {
        const e = estadoEditor();
        const titulo = e.titulo.trim();
        if (!titulo) { aviso('Escribe el nombre de la canción'); el('edTitulo').focus(); return; }
        const tono = e.tono.trim().toUpperCase();
        const notas = normalizarTexto(e.notas);

        if (editor.id == null) {
            // Una canción nueva se suma a Mi set y se abre ahí, con acordes en color y botones T+ / T−
            const id = Date.now();

            if (modoSet === 'sem') curGuardado.mio = misIds.length - 1; else cur = misIds.length - 1;

            cerrarEditor();
            irA('set');
            aviso('Canción agregada a tu set');
            return;

        const s = songPorId(editor.id);
        s.titulo = titulo; s.tono = tono; s.notas = notas;
        aviso('✔ Guardado');
        guardar();
        cerrarEditor();
        if (esVistaSet()) renderSet(); else renderLib();
    }
